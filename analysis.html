<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>FloodGuard 분석·시뮬레이션</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
    <main>
        <h2>위험도 분석 · 시뮬레이션 <span id="b"></span></h2>
        <p class="note">시뮬레이션 결과는 실제 예보가 아니라 가정한 조건에 따른 계산 결과입니다.</p>
        <div class="grid">
            <div class="card">
                <h3>관측소</h3><select id="st"></select>
                <div id="sl" style="margin-top:10px"></div>
            </div>
            <div class="card">
                <h3>변경 전 → 후</h3>
                <div class="big" id="res"></div>
                <div id="det" class="note"></div>
            </div>
        </div>
        <div class="card" style="margin-top:12px">
            <h3>시간당 강수량과 위험 점수의 관계 (나머지 입력은 현재 슬라이더 값)</h3><canvas id="ch" height="110"></canvas>
        </div>
        <div class="grid" style="margin-top:12px">
            <div class="card">
                <h3>수위 변화 (최근 관측)</h3><canvas id="c2"></canvas>
                <div id="e2" class="note"></div>
            </div>
            <div class="card">
                <h3>시간별 강수량 (수집 시점 기록)</h3><canvas id="c3"></canvas>
                <div id="e3" class="note"></div>
            </div>
            <div class="card">
                <h3>위험 단계별 지역 분포</h3><canvas id="c4"></canvas>
            </div>
        </div>
        <div class="card" style="margin-top:12px">
            <h3>지역별 상세 분석</h3>
            <div id="dt"></div>
        </div>
        <p class="note">도시침수 통계 출처: 기후에너지환경부 한강홍수통제소(공공데이터포털). 구 단위 시뮬레이션 지도 통계이며 실제 침수 이력이 아닙니다.</p>
    </main>
    <script type="module">
        import { load, shell, badge, rows, lvTag } from './js/app.js'; import { evaluate, ctxOf, WEIGHTS, LEVELS } from './js/riskCalculator.js';
        shell('analysis.html'); const d = await load(), $ = id => document.getElementById(id); $('b').innerHTML = badge(d);
        const R = d ? rows(d) : [];
        if (!R.length) { $('res').textContent = '데이터 없음' } else {
            Chart.defaults.color = '#93a8cc'; const ctx = ctxOf(d.stations, d.floodMax); let chart;
            $('st').innerHTML = R.map(r => `<option value="${r.code}">${r.name}</option>`).join('');
            const S = () => R.find(r => r.code === $('st').value), V = id => +document.getElementById(id).value;
            function build() {
                const s = S(), wmax = ((s.levels.srs ?? 5) * 1.3).toFixed(1);
                const f = [['h', '시간당 강수량(mm)', 0, 100, 1, s.rain1h ?? 0], ['cum', '누적 강수량(mm)', 0, 500, 5, s.rain24 ?? 0], ['wl', '하천 수위(m)', 0, wmax, .1, s.wl ?? 0], ['dur', '강수 지속시간(h)', 1, 24, 1, 3]];
                $('sl').innerHTML = f.map(([id, t, a, b, st, v]) => `<div class="row"><span>${t}</span><b id="${id}v"></b></div><input type="range" id="${id}" min="${a}" max="${b}" step="${st}" value="${v}">`).join('');
                f.forEach(([id]) => $(id).oninput = update); update(); detail(); series()
            }
            function update() {
                const s = S();['h', 'cum', 'wl', 'dur'].forEach(k => $(k + 'v').textContent = V(k));
                const ov = { h: V('h'), cum: V('cum'), wl: V('wl'), dur: V('dur') }, a = evaluate(s, ctx, ov);
                $('res').innerHTML = `${s.score.toFixed(0)} ${lvTag(s.lv)} → ${a.score.toFixed(0)} ${lvTag(a.lv)}`;
                const p = a.parts, fx = v => v == null ? '—(데이터 없음)' : v.toFixed(0);
                $('det').innerHTML = `강수 ${fx(p.rain)} · 수위 ${fx(p.level)} · 지형 ${fx(p.terrain)} · 침수 취약 ${fx(p.history)}(자료 없는 구는 제외 후 가중치 재정규화)<br>${s.lv === a.lv ? '위험 단계 변화 없음' : '위험 단계: ' + s.lv.n + ' → ' + a.lv.n}`;
                const xs = [...Array(21).keys()].map(i => i * 5), ys = xs.map(x => +evaluate(s, ctx, { ...ov, h: x }).score.toFixed(1)), cx = Math.round(ov.h / 5) * 5;
                const ds = [{ label: '위험 점수', data: ys, borderColor: '#60a5fa', tension: .2 }, { label: '현재 입력', data: xs.map((x, i) => x === cx ? a.score : null), pointRadius: 7, showLine: false, backgroundColor: a.lv.c }];
                if (chart) { chart.data.datasets = ds; chart.update() } else chart = new Chart($('ch'), { type: 'line', data: { labels: xs, datasets: ds }, options: { scales: { y: { min: 0, max: 100 }, x: { title: { display: true, text: '시간당 강수량(mm)' } } } } })
            }
            const mk = {}; const ch = (id, cfg) => { mk[id]?.destroy(); mk[id] = new Chart($(id), cfg) };
            const empty = (id, eid, m) => { mk[id]?.destroy(); mk[id] = null; $(eid).textContent = m };
            ch('c4', { type: 'doughnut', data: { labels: LEVELS.map(l => l.n), datasets: [{ data: LEVELS.map(l => R.filter(r => r.lv === l).length), backgroundColor: LEVELS.map(l => l.c) }] } });
            const GUIDE = { 안전: '평상시처럼 이용하되 기상 상황을 수시로 확인하세요.', 관심: '하천변 산책로와 저지대 주차 차량 상황을 확인하고 기상 특보를 살펴보세요.', 주의: '하천변 접근과 지하 공간 이용을 피하고 대피 경로를 미리 확인하세요.', 위험: '하천변·지하차도·반지하 등 저지대에서 벗어나 높은 곳으로 이동하고 재난 문자와 지자체 안내를 따르세요.' };
            function detail() {
                const s = S(), N = { rain: '강수', level: '수위', history: '침수 취약(도시침수지도)', terrain: '지형' }, fx = v => v == null ? '—' : v.toFixed(0), L = s.levels;
                $('dt').innerHTML = `<div class="grid"><div><b>${s.name}</b><div class="note">위치 ${s.lat}, ${s.lon} · 관측소 표고 ${s.gdt ?? '—'}m<br>기준 수위(m) 관심 ${L.att ?? '—'} · 주의 ${L.wrn ?? '—'} · 경계 ${L.alm ?? '—'} · 심각 ${L.srs ?? '—'}<br>현재 수위 ${s.wl ?? '—'}m · 시간 강수 ${s.rain1h ?? '—'}mm · 누적 ${s.rain24 ?? '—'}mm</div></div><table><tr><th>항목</th><th>점수</th><th>가중치</th></tr>${Object.keys(N).map(k => `<tr><td>${N[k]}</td><td>${fx(s.parts[k])}</td><td>${s.parts[k] == null ? '제외' : WEIGHTS[k]}</td></tr>`).join('')}</table><div>${lvTag(s.lv)} <span class="note">일반적인 행동 요령</span><br>${GUIDE[s.lv.n]}</div></div>`
            }
            function series() {
                const s = S(), w = s.wseries, h = (s.hist || []).filter(x => x.r != null);
                if (w?.length) { $('e2').textContent = ''; const a = [...w].reverse(); ch('c2', { type: 'line', data: { labels: a.map(x => x.t.slice(4, 6) + '/' + x.t.slice(6, 8) + ' ' + x.t.slice(8, 10) + ':' + x.t.slice(10, 12)), datasets: [{ label: '수위(m)', data: a.map(x => x.v), borderColor: '#60a5fa', pointRadius: 2 }, ...[['att', '관심 수위', '#eab308'], ['srs', '심각 수위', '#ef4444']].filter(([k]) => s.levels[k] != null).map(([k, n, c]) => ({ label: n, data: a.map(() => s.levels[k]), borderColor: c, borderDash: [4, 4], pointRadius: 0 }))] } }) } else empty('c2', 'e2', '수위 시계열 데이터가 없습니다(데모 데이터이거나 수집을 다시 실행해야 합니다).');
                if (h.length) { $('e3').textContent = ''; ch('c3', { type: 'bar', data: { labels: h.map(x => x.t.slice(4, 6) + '/' + x.t.slice(6, 8) + ' ' + x.t.slice(8, 10) + '시'), datasets: [{ label: '1시간 강수량(mm)', data: h.map(x => x.r), backgroundColor: '#3b82f6' }] } }) } else empty('c3', 'e3', '강수량 기록이 없습니다(수집이 누적되면 표시됩니다).')
            }
            $('st').onchange = build; build()
        }
    </script>
</body>

</html>
