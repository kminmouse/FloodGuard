<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>FloodGuard 분석·시뮬레이션</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
    <main>
        <h2>위험도 분석 · 시뮬레이션 <span id="b"></span></h2>
        <p class="note">시뮬레이션 결과는 실제 예보가 아니라 가정한 조건에 따른 계산 결과입니다.</p>
        <div class="grid">
            <div class="card">
                <h3>관측소</h3><select id="st"></select>
                <div id="sl" style="margin-top:10px"></div>
            </div>
            <div class="card">
                <h3>변경 전 → 후</h3>
                <div class="big" id="res"></div>
                <div id="det" class="note"></div>
            </div>
        </div>
        <div class="card" style="margin-top:12px">
            <h3>시간당 강수량과 위험 점수의 관계 (나머지 입력은 현재 슬라이더 값)</h3><canvas id="ch" height="110"></canvas>
        </div>
    </main>
    <script type="module">
        import {load, shell, badge, rows, lvTag} from './js/app.js'; import {evaluate, ctxOf} from './js/riskCalculator.js';
        shell('analysis.html'); const d = await load(), $ = id => document.getElementById(id); $('b').innerHTML = badge(d);
        const R = d ? rows(d) : [];
        if (!R.length) {$('res').textContent = '데이터 없음'} else {
            Chart.defaults.color = '#93a8cc'; const ctx = ctxOf(d.stations); let chart;
            $('st').innerHTML = R.map(r => `<option value="${r.code}">${r.name}</option>`).join('');
            const S = () => R.find(r => r.code === $('st').value), V = id => +document.getElementById(id).value;
            function build() {
                const s = S(), wmax = ((s.levels.srs ?? 5) * 1.3).toFixed(1);
                const f = [['h', '시간당 강수량(mm)', 0, 100, 1, s.rain1h ?? 0], ['cum', '누적 강수량(mm)', 0, 500, 5, s.rain24 ?? 0], ['wl', '하천 수위(m)', 0, wmax, .1, s.wl ?? 0], ['dur', '강수 지속시간(h)', 1, 24, 1, 3]];
                $('sl').innerHTML = f.map(([id, t, a, b, st, v]) => `<div class="row"><span>${t}</span><b id="${id}v"></b></div><input type="range" id="${id}" min="${a}" max="${b}" step="${st}" value="${v}">`).join('');
                f.forEach(([id]) => $(id).oninput = update); update()
            }
            function update() {
                const s = S();['h', 'cum', 'wl', 'dur'].forEach(k => $(k + 'v').textContent = V(k));
                const ov = {h: V('h'), cum: V('cum'), wl: V('wl'), dur: V('dur')}, a = evaluate(s, ctx, ov);
                $('res').innerHTML = `${s.score.toFixed(0)} ${lvTag(s.lv)} → ${a.score.toFixed(0)} ${lvTag(a.lv)}`;
                const p = a.parts, fx = v => v == null ? '—(데이터 없음)' : v.toFixed(0);
                $('det').innerHTML = `강수 ${fx(p.rain)} · 수위 ${fx(p.level)} · 지형 ${fx(p.terrain)} · 침수 이력 ${fx(p.history)}(미연동, 가중치 재정규화)<br>${s.lv === a.lv ? '위험 단계 변화 없음' : '위험 단계: ' + s.lv.n + ' → ' + a.lv.n}`;
                const xs = [...Array(21).keys()].map(i => i * 5), ys = xs.map(x => +evaluate(s, ctx, {...ov, h: x}).score.toFixed(1)), cx = Math.round(ov.h / 5) * 5;
                const ds = [{label: '위험 점수', data: ys, borderColor: '#60a5fa', tension: .2}, {label: '현재 입력', data: xs.map((x, i) => x === cx ? a.score : null), pointRadius: 7, showLine: false, backgroundColor: a.lv.c}];
                if (chart) {chart.data.datasets = ds; chart.update()} else chart = new Chart($('ch'), {type: 'line', data: {labels: xs, datasets: ds}, options: {scales: {y: {min: 0, max: 100}, x: {title: {display: true, text: '시간당 강수량(mm)'}}}}})
            }
            $('st').onchange = build; build()
        }
    </script>
</body>

</html>
